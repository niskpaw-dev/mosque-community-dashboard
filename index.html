﻿<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/prayer-future-glass.css" />
    <title>Waktu Solat Dashboard</title>
  </head>
  <body>
    <div class="page-shell">
      <div class="hero-floating-ambient" aria-hidden="true"></div>

      <!-- Wrapper Grid Atas untuk elak Overlap -->
      <div class="top-bar">
        <!-- Flip Clock (Waktu Semasa) -->
        <div class="top-left-clock">
          <div class="flip-group">
            <div class="flip-card" id="flipHour">--</div>
          </div>
          <div class="flip-colon">:</div>
          <div class="flip-group">
            <div class="flip-card" id="flipMinute">--</div>
          </div>
          <div class="flip-colon">:</div>
          <div class="flip-group">
            <div class="flip-card" id="flipSecond">--</div>
          </div>
          <div class="flip-ampm" id="flipAmpm">--</div>
        </div>

        <header class="top-date">
          <div class="top-date__glow" aria-hidden="true"></div>

          <div class="top-date__text">
            <div class="top-date__value" id="miladiHijriDate">Loading...</div>
            <div class="top-date__subtitle">
              Waktu Solat Daerah Kuala Langat &bull; <span id="weatherStatus">Memuat cuaca...</span>
            </div>
          </div>
        </header>

        <!-- Logo Masjid -->
        <div class="top-right-logo">
          <img src="https://arleta.site/interactivelink/1610/LOGO-MKSLB.png" alt="Logo Masjid" />
        </div>
      </div>

      <main class="dashboard">
        <section class="card hero-card waktu-solat">

          <div class="hero-body">
            <div class="hero-next" aria-label="Next upcoming prayer">
              <div class="hero-next__label">WAKTU SOLAT SETERUSNYA</div>
              <div class="hero-next__name" id="nextPrayerFocus">—</div>
              <div class="hero-next__time" id="nextPrayerTimeFocus">--:--</div>
            </div>

            <div class="hero-next-time-ghost" aria-hidden="true"></div>

            <div
              class="countdown-ring-grid"
              aria-label="Countdown to next prayer"
            >
              <div class="ring-card" data-ring="jam">
                <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
                  <circle class="ring__bg" cx="60" cy="60" r="48" />
                  <circle class="ring__fg" cx="60" cy="60" r="48" />
                </svg>
                <div class="ring-card__content">
                  <div class="ring-card__value" id="timerJam">--</div>
                  <div class="ring-card__label">JAM</div>
                </div>
              </div>

              <div class="ring-card" data-ring="minit">
                <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
                  <circle class="ring__bg" cx="60" cy="60" r="48" />
                  <circle class="ring__fg" cx="60" cy="60" r="48" />
                </svg>
                <div class="ring-card__content">
                  <div class="ring-card__value" id="timerMinit">--</div>
                  <div class="ring-card__label">MINIT</div>
                </div>
              </div>

              <div class="ring-card" data-ring="saat">
                <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
                  <circle class="ring__bg" cx="60" cy="60" r="48" />
                  <circle class="ring__fg" cx="60" cy="60" r="48" />
                </svg>
                <div class="ring-card__content">
                  <div class="ring-card__value" id="timerSaat">--</div>
                  <div class="ring-card__label">SAAT</div>
                </div>
              </div>
            </div>

            <p id="lastUpdated" class="last-updated">Dikemaskini --</p>
          </div>
        </section>

        <section class="card schedule-card">
          <div class="schedule-grid" id="prayerSchedule"></div>
        </section>
      </main>
    </div>

    <!-- Overlay Iklan / Slideshow -->
    <div id="posterSlideshow" class="poster-slideshow hidden" aria-hidden="true">
      <img id="posterImage" src="" alt="Iklan Masjid" />
      <video id="posterVideo" muted loop playsinline></video>
      <div class="poster-slideshow__overlay">
        Kembali ke jadual dalam <span id="posterCountdown">--</span>s
      </div>
    </div>

    <script type="module" src="utils/app.js"></script>
  </body>
</html>
